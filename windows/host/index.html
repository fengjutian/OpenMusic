<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenMusic</title>
  <!--
    OpenMusic Windows host (route C, ADR-0001).

    Loads the same `main.web.bundle` produced for the ReactLynx tree, then
    renders it via the Lynx Web runtime inside a `<lynx-view>` custom element.
    File picker lets the user supply real audio files; they are converted to
    blob URLs and pushed into `globalThis.__openmusicImportedTracks` before
    the bundle bootstraps.

    Vendored runtime
    ----------------
    `@lynx-js/web-core` + `remote-web-worker` are copied into
    `windows/host/vendor/` by `scripts/prepare-windows-host.mjs` and served
    from the project root by `scripts/serve-windows-host.mjs`. We do this so:
      1. The host has no CDN dependency at runtime (production posture).
      2. The Lynx Web runtime's template-loader Worker can be loaded from the
         same origin (cross-origin Worker construction throws SecurityError).
      3. CDN URLs are easy to swap out for local copies during dev.

    `remote-web-worker` must be imported BEFORE `@lynx-js/web-core/client` so
    its `Worker` polyfill is installed first; see web-core README.

    Verification status: this host has been opened in Chromium / Edge via the
    in-app Browser and produced the ReactLynx tree. Edge WebView2 was not
    separately launched because the engine is the same Chromium. See
    `docs/platform-capability-matrix.md` §主能力矩阵 "Windows — Lynx 嵌入".
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    lynx-view {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .error-banner {
      color: #fee;
      padding: 16px;
      white-space: pre-wrap;
      background: #220000;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 13px;
    }
    .toolbar {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }
    .toolbar button {
      font: inherit;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    .toolbar button:hover { background: #333; }
    .toolbar .status {
      align-self: center;
      font-size: 12px;
      color: #aaa;
    }
    /* Hide the file input — the toolbar button proxies clicks into it. */
    #picker { display: none; }
  </style>

  <link rel="stylesheet" href="./vendor/static/css/client.css" />
  <script type="module">
    // Polyfill Worker BEFORE web-core evaluates.
    import './vendor/remote-web-worker/module.js';
    import './vendor/static/js/client.js';

    /**
     * Convert a FileList of user-picked audio into Track[] (serializable form).
     * The bundle consumes this through `globalThis.__openmusicImportedTracks`.
     */
    function filesToTracks(fileList) {
      const tracks = [];
      const seen = new Map();
      let counter = 0;
      for (const file of fileList) {
        if (!/\.(mp3|m4a|ogg|wav|flac|aac)$/i.test(file.name)) continue;
        counter += 1;
        // Derive a stable id from filename + size + modified time so reloading
        // the same folder yields the same id and the player keeps its queue.
        const key = `${file.name}|${file.size}|${file.lastModified}`;
        let id = key.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 32);
        if (!id) id = `tr_${counter}`;
        while (seen.has(id)) id = `${id}_${counter}`;
        seen.set(id, true);

        // Strip extension for the title; later stages can replace with ID3.
        const lastDot = file.name.lastIndexOf('.');
        const title = lastDot >= 0 ? file.name.slice(0, lastDot) : file.name;
        const url = URL.createObjectURL(file);
        tracks.push({
          id,
          title,
          artists: [{ id: 'ar_local', name: '本地音乐' }],
          album: {
            id: 'al_local',
            title: '已导入',
            coverUrl: '',
            year: file.lastModified
              ? new Date(file.lastModified).getFullYear()
              : undefined,
          },
          coverUrl: '',
          durationMs: 0,
          playable: true,
          audioUrl: url,
          source: 'local',
          sizeBytes: file.size,
        });
      }
      return tracks;
    }

    function pickAndReload(input) {
      if (!input.files || input.files.length === 0) return;
      const tracks = filesToTracks(input.files);
      if (tracks.length === 0) {
        alert('没有识别到音频文件（需要 mp3 / m4a / ogg / wav / flac / aac）');
        return;
      }
      window.__openmusicImportedTracks = tracks;
      // Reset the input so picking the same folder again re-fires `change`.
      input.value = '';
      document.getElementById('status').textContent =
        `已导入 ${tracks.length} 首 · 重新载入中…`;
      // Bootstrap will read `__openmusicImportedTracks` on the next load.
      // We reload the bundle by reloading the lynx-view's url.
      location.reload();
    }

    function renderToolbar() {
      const bar = document.createElement('div');
      bar.className = 'toolbar';
      const button = document.createElement('button');
      button.textContent = '选择音乐目录';
      const status = document.createElement('span');
      status.className = 'status';
      status.id = 'status';
      status.textContent = '当前：demo seed';
      const input = document.createElement('input');
      input.type = 'file';
      input.id = 'picker';
      input.multiple = true;
      // `webkitdirectory` is the legacy attribute that Chromium and Edge
      // still honour for directory pickers.
      input.setAttribute('webkitdirectory', '');
      input.setAttribute('directory', '');
      input.addEventListener('change', () => pickAndReload(input));
      button.addEventListener('click', () => input.click());
      bar.appendChild(button);
      bar.appendChild(status);
      bar.appendChild(input);
      document.body.appendChild(bar);
    }

    /**
     * Stage-9 end-to-end test hook: navigating with `#seed-imports=<n>`
     * pre-fills `__openmusicImportedTracks` with `<n>` synthetic blob: tracks
     * so the bundle bootstraps against `LocalMusicRepository` without
     * having to drive the native file dialog. The hook is harmless in
     * production because the synthetic blob: URLs point at empty content.
     */
    function maybeSeedFromHash() {
      const match = location.hash.match(/#seed-imports=(\d+)/);
      if (!match) return;
      const count = Math.min(50, Math.max(1, Number(match[1])));
      const tracks = [];
      for (let i = 1; i <= count; i += 1) {
        tracks.push({
          id: `seed_${i}`,
          title: `种子曲目 ${i}`,
          artists: [{ id: 'ar_seed', name: '种子歌手' }],
          album: { id: 'al_seed', title: '种子专辑', coverUrl: '', year: 2024 },
          coverUrl: '',
          durationMs: 0,
          playable: true,
          // blob: URLs pointing at an empty Blob — WebAudioEngine will fail
          // to decode but the UI flow can be exercised.
          audioUrl: URL.createObjectURL(new Blob([new Uint8Array(0)], { type: 'audio/mpeg' })),
          source: 'local',
        });
      }
      window.__openmusicImportedTracks = tracks;
      const status = document.getElementById('status');
      if (status) status.textContent = `当前：hash seed (${count} 首)`;
    }

    /**
     * Stage-9.6 hook: probe the `openmusic` IndexedDB and surface the count
     * of persisted tracks into the toolbar status so we can verify persistence
     * without relying on the lynx Shadow DOM (web-core keeps the ReactLynx
     * tree in a worker, invisible to the main-thread DevTools).
     */
    async function probeOpenMusicDb() {
      const status = document.getElementById('status');
      if (!status) return;
      const factory = window.indexedDB;
      if (!factory) {
        status.dataset.idbProbe = 'no-idb';
        return;
      }
      try {
        const dbs = (await factory.databases?.()) ?? [];
        const target = dbs.find((db) => db.name === 'openmusic');
        if (!target) {
          status.dataset.idbProbe = 'no-db';
          return;
        }
        const open = factory.open('openmusic');
        await new Promise((resolve) => {
          open.onsuccess = () => {
            const db = open.result;
            const tx = db.transaction('tracks', 'readonly');
            const req = tx.objectStore('tracks').count();
            req.onsuccess = () => {
              const count = req.result;
              status.dataset.idbProbe = `tracks=${count}`;
              status.textContent = `IDB tracks=${count}`;
              db.close();
              resolve();
            };
            req.onerror = () => {
              status.dataset.idbProbe = 'probe-error';
              db.close();
              resolve();
            };
          };
          open.onerror = () => {
            status.dataset.idbProbe = 'open-error';
            resolve();
          };
        });
      } catch (err) {
        status.dataset.idbProbe = `probe-exception`;
      }
    }

    function mountLynx() {
      const view = document.createElement('lynx-view');
      view.id = 'app';
      view.style.width = '100vw';
      view.style.height = '100vh';
      // Absolute URL relative to the current origin so the runtime cannot
      // mis-resolve the relative path through its own base URL.
      view.setAttribute('url', `${location.origin}/dist/main.web.bundle`);
      document.body.appendChild(view);

      view.addEventListener('error', (event) => {
        console.error('[OpenMusic] lynx-view failed to load:', event.detail ?? event);
        view.setAttribute('data-error', 'true');
        const banner = document.createElement('pre');
        banner.className = 'error-banner';
        const detail = event?.detail ?? event;
        banner.textContent =
          'OpenMusic 启动失败：' +
          (detail?.message ?? detail?.toString?.() ?? '未知错误');
        document.body.appendChild(banner);
      });

      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'OpenMusic',
            artist: '正在准备',
            album: '',
          });
        } catch (cause) {
          console.warn('[OpenMusic] mediaSession.metadata set failed:', cause);
        }
      } else {
        console.warn('[OpenMusic] navigator.mediaSession is unavailable in this host.');
      }
    }

    renderToolbar();
    maybeSeedFromHash();
    mountLynx();
    // Probe late so the bundle has time to finish hydration + first IDB
    // write. Real-world first boot can take a couple of seconds even on a
    // local server because web-core spins its worker up and the ReactLynx
    // tree has to mount before the catalog constructor runs.
    setTimeout(probeOpenMusicDb, 10000);
  </script>
</head>
<body>
</body>
</html>
